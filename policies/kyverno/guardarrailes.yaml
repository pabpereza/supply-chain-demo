# Guardarraíles básicos. Se escribe para Pods y Kyverno genera solo (autogen)
# la versión para Deployments, StatefulSets, Jobs, CronJobs...
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: guardarrailes
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: demo
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: "variables.containers.all(c, c.image.contains(':') && !c.image.contains(':latest'))"
      message: 'imagen sin tag o con latest'
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)"
      message: 'contenedor privileged'
    - expression: "(has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot == true) || variables.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)"
      message: 'falta runAsNonRoot'
    - expression: "variables.containers.all(c, has(c.resources) && has(c.resources.limits) && has(c.resources.limits.memory))"
      message: 'falta resources.limits.memory'
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('pabpereza/') ||
          c.image.startsWith('docker.io/pabpereza/') ||
          c.image.startsWith('index.docker.io/pabpereza/'))
      message: 'solo se admiten imágenes de docker.io/pabpereza'
