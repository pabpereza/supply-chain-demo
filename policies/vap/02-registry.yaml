apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: solo-mi-registry
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
      - apiGroups: ['apps']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['deployments', 'statefulsets', 'daemonsets']
  variables:
    - name: pod
      expression: "object.kind == 'Pod' ? object.spec : object.spec.template.spec"
  validations:
    # CEL compara el texto tal cual: hay que aceptar las tres formas del mismo nombre
    - expression: >-
        variables.pod.containers.all(c,
          c.image.startsWith('pabpereza/') ||
          c.image.startsWith('docker.io/pabpereza/') ||
          c.image.startsWith('index.docker.io/pabpereza/'))
      message: 'solo se admiten imágenes de docker.io/pabpereza'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: solo-mi-registry
spec:
  policyName: solo-mi-registry
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: demo
