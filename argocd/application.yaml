apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pabpereza/supply-chain-demo
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  # Sync manual: en directo se ve cuándo entra cada commit y no hay reintentos
  # de un sync fallido que bloqueen el siguiente
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
